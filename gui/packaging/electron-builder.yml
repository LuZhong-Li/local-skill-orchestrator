# 打包配置：Windows 目标（安装包 + 免安装单文件），产物输出到仓库根的 build/ 目录。
# 内核以独立可执行文件形态随包分发（AD-09）：放到 resources/kernel/ 下，
# 主进程按 resourcesPath 调用；开发模式则直接用 node 跑仓库内的内核入口。
appId: local.skill-manager.desktop
productName: skill-manager
# 打包器要求固定版本：它按该版本下载对应平台运行时，无法从 semver 范围解析
electronVersion: 44.7.2
directories:
  output: ../build/desktop
  buildResources: .
# 实测记录：compression 由 normal 调到 maximum 后，安装包与便携产物体积只差 63 字节
# （125,519,722 → 125,519,785），收益为零而打包耗时增加，因此维持默认档位，不做无依据的调整。
files:
  - out/**/*
  - package.json
  # 渲染层已由 Vite 打包（Vue 内联进 out/renderer 的产物），主进程与预加载只引用
  # electron 与 Node 内置模块；gui 的 dependencies 全是构建期依赖，随包只会白占体积。
  # 排除后 app.asar 从约 15 MB 降到数百 KB，运行期不需要任何 node_modules。
  - '!node_modules/**'
# 只保留界面实际用得到的语言包：Electron 默认携带 55 个 locale（约 48 MiB）。
# 系统语言不在列表时 Chromium 回退到 en-US，因此中文与英文之外的语言包可以安全裁剪。
electronLanguages:
  - zh-CN
  - en-US
extraResources:
  # 由内核构建脚本产出的可执行文件；缺失时打包仍会成功，但运行期找不到内核会报通道异常
  # 路径相对项目目录（gui/）解析，因此这里回到仓库根再进 build/
  # 实测记录：内核可执行文件（= Node 运行时 87.2 MiB + 0.7 MB 内核包）在安装包与便携产物中
  # 各占约 23 MB（119.7 → 97.8 MiB），解包后占 92 MB；这是 AD-09 独立可执行文件形态的代价，
  # 换形态需先改架构决议，不在体积优化批次内擅动。
  - from: ../build/kernel
    to: kernel
    filter:
      - '**/*'
win:
  # 显式给出图标路径：默认只在 buildResources 下按约定名查找，本项目把资源放在 packaging/
  icon: packaging/icon.ico
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}

# macOS：产出 .dmg（arm64 与 x64 两个架构分别打包，不做 universal）。
# 未签名交付（M2 决策点 2）：这里**不写任何签名相关键**（identity / forceCodeSigning /
# hardenedRuntime / notarize 都不出现），签名身份自动发现由打包入口以环境变量
# CSC_IDENTITY_AUTO_DISCOVERY=false 关闭——用环境变量而非配置键，可跨 electron-builder
# 主版本成立（v27 起签名选项已迁入 mac.sign 组）。
# 签名预留（仅文档，不实现）：证书与公证就位后，把下列官方 secrets 配到仓库后，
# 由「secrets 存在才运行的签名 job」接管，并移除上面那句环境变量：
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID /
#   APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
mac:
  icon: packaging/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
  artifactName: ${productName}-${version}-${arch}.${ext}

# Linux：产出 .AppImage（x64）。基座为 ubuntu-24.04，产物 glibc 下界 2.39
# （发布说明与 README 同步登记；更老的系统走源码构建）。
linux:
  icon: packaging/icons
  # 可执行名不能从包名（@skill-manager/gui）推导：electron-builder 会拼成
  # 「@skill-managergui」，AppImage 目标因此报 executableName 含非法字符而构建失败。
  executableName: skill-manager
  category: Utility
  synopsis: Skill 元信息管理器（命令行内核 + 桌面外壳）
  description: 统一管理环境内已安装 Skill 的元数据：登记、索引、安装、卸载、启用、禁用、更新、校验、依赖检查与备份导入导出。
  # 打包者标识取仓库既有提交身份，不新造个人信息。
  # T2 真机实测（run 38871300587 的 Linux leg，注解公开可见）：AppImage 形态**不消费**本字段
  # ——解包后的产物树中未出现该字符串（结论 not-consumed）。字段保留仅为配置完整性
  # （deb / rpm 等形态才消费它），如需复测用 scripts/check-maintainer.mjs。
  maintainer: skill-manager <3338004299@qq.com>
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}

name: 校验（可复用）

# 本工作流的唯一职责：把「校验步骤集合」定义在一处（需求 M2-R5：不得为单个平台维护独立序列）。
# ci.yml（每次提交门禁）与 pack.yml（打包前门禁）都消费本文件；步骤的增删只改这里。
# 触发只有 workflow_call：本文件不自行触发任何事件。
#
# 动作版本与 runner 标签（设计 11 章 DP-D / DP-E）：
#   - 三个官方动作一律使用面向 Node 24 运行时的主版本（checkout@v5、setup-node@v5、upload-artifact@v6），
#     避免落到「面向 Node 20 被强制在 Node 24 上运行」的废弃告警；
#   - Linux runner 固定为 ubuntu-24.04：`ubuntu-latest` 将于 2026-10-19 迁移到 Ubuntu 26，
#     固定标签让操作系统升级成为显式决策而不是静默变化；Windows 无同类迁移公告，暂用 windows-latest。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # 读取版本声明：矩阵的 Node 取值以 .nvmrc 为唯一来源（设计 4 章的「同源」要求）
  prepare:
    name: 读取版本声明
    runs-on: ubuntu-24.04
    outputs:
      node_versions: ${{ steps.nvmrc.outputs.versions }}
    steps:
      - name: 检出
        uses: actions/checkout@v5
      - name: 从 .nvmrc 生成矩阵取值
        id: nvmrc
        shell: bash
        run: |
          version="$(tr -d ' \t\r\n' < .nvmrc)"
          if [[ ! "$version" =~ ^[0-9]+$ ]]; then
            echo "::error::.nvmrc 内容不是单个主版本号：$version"
            exit 1
          fi
          echo "versions=[\"$version\"]" >> "$GITHUB_OUTPUT"
          echo "矩阵 Node 版本取自 .nvmrc：$version"

  verify:
    name: 验证（${{ matrix.os }} / Node ${{ matrix.node }}）
    needs: prepare
    runs-on: ${{ matrix.os }}
    # 硬上限 60 分钟（设计 8 章）；目标为 30 分钟以内
    timeout-minutes: 60
    strategy:
      # 一个组合失败不掩盖其他组合的结果；任一组合失败即整次运行失败
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
        node: ${{ fromJSON(needs.prepare.outputs.node_versions) }}
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # 依赖缓存：键由平台、Node 版本与依赖锁文件的哈希共同决定（设计 6 章）
          cache: npm

      - name: 版本声明一致性守卫（矩阵取值与 .nvmrc）
        run: node scripts/check-node-version.mjs --expect ${{ matrix.node }}

      - name: 一、安装依赖（按锁文件）
        run: npm ci

      - name: 二、契约校验与分层校验
        run: npm run check

      - name: 三、类型检查
        run: npm run typecheck

      - name: 四、代码规范
        run: npm run lint

      - name: 五、格式检查（只读）
        run: npm run format:check

      - name: 六、测试（单元 / 契约 / 端到端，含用例数核对）
        run: npm test

      - name: 七、构建（内核独立可执行文件 + 桌面外壳构建）
        run: npm run build

      - name: 八、缩减冒烟（内核侧，不启动 Electron）
        run: npm run smoke:kernel

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: skill-manager-${{ runner.os }}-${{ runner.arch }}-run${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/kernel/skill-manager.exe
            gui/out/**

      # 失败时保留已产出的部分产物，便于诊断（日志由运行记录本身保留）
      - name: 失败时的诊断产物
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ runner.os }}-run${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/**
            gui/out/**

  # M4c-7：全机盘点 fixture 探针。独立 job 的原因：
  #   - 主 verify 矩阵沿用既有 Windows/Linux 全量门禁，不把 macOS 全量构建塞进每次提交；
  #   - 探针只跑 CLI 与临时 fixture，轻量且三平台口径完全一致；
  #   - fail-fast: false 与 pack.yml 的矩阵策略一致，一个平台失败不掩盖其他平台结论。
  inventory-probe:
    name: 全机盘点 fixture 探针（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-15
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Node（取自 .nvmrc）
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 三平台全机盘点探针
        run: npm run probe:inventory

  # T6：reconcile 写动作探针。与 inventory-probe 同样独立成 job：
  #   - 三平台真实执行预览与 apply，验证路径、账本、原子换名与回滚；
  #   - 只使用隔离 HOME 与显式 config 根，不接触 runner 的真实宿主目录；
  #   - 与主 verify 矩阵解耦，避免把 macOS 全量构建塞进每次提交。
  reconcile-probe:
    name: 盘点动作写探针（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-15
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Node（取自 .nvmrc）
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 三平台 reconcile 写动作探针
        run: npm run probe:reconcile

name: Pack

# 打包矩阵（设计 3.1 / 3.3；需求 M2-R1 ~ M2-R5）：
#   - tag v*：发布前的全平台打包（Release 发布在 T3 接入同一工作流；本批只产出 artifact）；
#   - workflow_dispatch：按需预演，可只跑指定平台、可覆盖 mac 架构（留空即跑四 leg 全量）。
# 每次提交的快速门禁仍由 ci.yml 承担：push / PR 不触发本工作流，运行时长与 M1 现状一致。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: '只跑指定平台（留空 = 全部；可选 windows / linux / mac）'
        required: false
        default: ''
      arch:
        description: 'mac 架构覆盖（留空 = 按 leg；可选 arm64 / x64）'
        required: false
        default: ''

# 同一 ref 的旧运行取消；tag 运行不取消（发布语义不得被后续运行打断）
concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  # 打包前门禁：消费与 ci.yml 同一份校验步骤定义（M2-R5），失败即不进入打包
  verify:
    name: 打包前校验
    uses: ./.github/workflows/verify.yml

  pack:
    name: 打包（${{ matrix.leg }}）
    needs: verify
    runs-on: ${{ matrix.os }}
    # 硬上限 60 分钟（设计 8 章）
    timeout-minutes: 60
    # 说明：job 级 if 不能引用 matrix（工作流校验会拒绝），因此 platforms 输入在**步骤级**过滤：
    # 选中的 leg 才执行打包/证据/上传步骤；未选中的 leg 只完成检出与依赖安装即结束。
    # 判定表达式：`github.event_name != 'workflow_dispatch' || inputs.platforms == '' || inputs.platforms == matrix.platform`
    strategy:
      # 一个平台失败不掩盖其他平台结论（设计 3.4；fixture 探测见 CHANGELOG）
      fail-fast: false
      matrix:
        include:
          - leg: windows
            os: windows-latest
            platform: windows
            artifact_glob: build/desktop/*.exe
          - leg: linux
            os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact_glob: build/desktop/*.AppImage
          - leg: mac-arm64
            os: macos-15
            platform: mac
            arch: arm64
            artifact_glob: build/desktop/*.dmg
          - leg: mac-x64
            os: macos-15-intel
            platform: mac
            arch: x64
            artifact_glob: build/desktop/*.dmg
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Node（取自 .nvmrc）
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖（按锁文件）
        run: npm ci

      # AppImage 工具链依赖 FUSE 2：runner 镜像未预装（设计 7.1 / R-2、R-6），在此显式安装
      - name: 安装 Linux 打包依赖（AppImage 工具链需要 FUSE 2）
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.platforms == '' ||
          inputs.platforms == matrix.platform) && matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      # Windows 沿用二期入口（配置与产物口径不变）：图标 → 内核 → 安装包 + 便携单文件
      # 失败时把关键行折进注解：未登录会话也能读到失败原因（运行页的 Annotations 区）
      - name: 打包（Windows：nsis 安装包 + 便携单文件）
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.platforms == '' ||
          inputs.platforms == matrix.platform) && matrix.platform == 'windows'
        shell: bash
        run: |
          set +e
          output="$( { npm run build:icon && npm run build:kernel && npm run pack:win -w @skill-manager/gui; } 2>&1 )"
          status=$?
          printf '%s\n' "$output"
          mkdir -p build/desktop
          printf '%s\n' "$output" >> build/desktop/pack-debug.log
          if [ "$status" -ne 0 ]; then
            reason="$(printf '%s\n' "$output" | { grep -E 'Error|error|ERROR|failed|ENOENT|cannot|Cannot|退出码' || tail -n 3; } | tail -n 3 | tr '\n' ' ' | cut -c1-500)"
            [ -n "$reason" ] || reason="$(tail -n 8 build/desktop/pack-debug.log | tr '\n' ' ' | cut -c1-500)"
            echo "::error title=打包失败（${{ matrix.leg }}）::exit=${status}；输出 ${#output} 字节；${reason:-命令无输出且诊断日志为空}"
            exit "$status"
          fi

      # macOS / Linux：走打包入口（内部按平台串联 图标 →（mac）icns → 内核 → 界面 → electron-builder）
      - name: 打包（macOS / Linux，未签名）
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.platforms == '' ||
          inputs.platforms == matrix.platform) && matrix.platform != 'windows'
        env:
          PACK_ARCH: ${{ matrix.arch }}
          ARCH_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.arch || '' }}
        shell: bash
        run: |
          set +e
          output="$(node scripts/pack.mjs --platform ${{ matrix.platform }} --arch "${ARCH_OVERRIDE:-$PACK_ARCH}" 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            stage="$(tail -n 1 build/desktop/pack-stage.txt 2>/dev/null)"
            reason="$(printf '%s\n' "$output" | { grep -E 'Error|error|ERROR|failed|ENOENT|cannot|Cannot|退出码' || tail -n 3; } | tail -n 3 | tr '\n' ' ' | cut -c1-500)"
            [ -n "$reason" ] || reason="$(tail -n 8 build/desktop/pack-debug.log 2>/dev/null | tr '\n' ' ' | cut -c1-500)"
            echo "::error title=打包失败（${{ matrix.leg }}）::exit=${status}；最后阶段=${stage:-未知}；${reason:-命令无输出且诊断日志为空}"
            exit "$status"
          fi

      # 真机证据：icns 由 iconutil 产出（EX-03）＋ 独立的未签名断言复核（pack.mjs 内已断言一次）
      - name: 真机验证（macOS）：icns 产物与未签名断言
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.platforms == '' ||
          inputs.platforms == matrix.platform) && matrix.platform == 'mac'
        shell: bash
        run: |
          icns_bytes="$(wc -c < gui/packaging/icon.icns | tr -d ' ')"
          if [ "$icns_bytes" -le 0 ]; then
            echo "::error::icon.icns 为空：iconutil 未产出有效文件"
            exit 1
          fi
          echo "::notice title=EX-03 iconutil 真机验证::${{ matrix.leg }} 上 icon.icns 由 iconutil 产出（${icns_bytes} 字节）"
          app="$(ls -d build/desktop/mac*/*.app | head -n 1)"
          echo "app=$app"
          verdict="$(node scripts/assert-unsigned.mjs "$app")"
          echo "$verdict"
          echo "::notice title=codesign 未签名断言::${verdict}"
          # EX-07：包内内核二进制必须带有效签名（ad-hoc）。缺签名曾是 arm64 打包失败的原因，
          # 这里把它变成可失败断言 + 公开注解，防止同类回归。
          kernel="$app/Contents/Resources/kernel/skill-manager.exe"
          if [ ! -f "$kernel" ]; then
            echo "::error::包内未找到内核可执行文件：$kernel"
            exit 1
          fi
          if ! codesign -dv "$kernel" > kernel-codesign.txt 2>&1; then
            echo "::error title=内核签名无效（${{ matrix.leg }}）::$(head -n 3 kernel-codesign.txt | tr '\n' ' ' | cut -c1-500)"
            exit 1
          fi
          echo "::notice title=EX-07 内核 ad-hoc 签名::$(head -n 1 kernel-codesign.txt)"

      # 真机证据：AppImage 是否消费 linux.maintainer（T1 判定逻辑，单侧实测；结论回写配置）
      - name: 真机验证（Linux）：maintainer 消费实测
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.platforms == '' ||
          inputs.platforms == matrix.platform) && matrix.platform == 'linux'
        shell: bash
        run: |
          appimage="$(ls build/desktop/*.AppImage | head -n 1)"
          chmod +x "$appimage"
          "$appimage" --appimage-extract > /dev/null
          verdict="$(node scripts/check-maintainer.mjs --with squashfs-root | tail -n 1)"
          echo "$verdict"
          echo "::notice title=linux.maintainer 消费实测::$verdict"

      - name: 上传产物
        # 未选中的 leg 不上传（其打包步骤已被跳过）
        if: >-
          github.event_name != 'workflow_dispatch' || inputs.platforms == '' ||
          inputs.platforms == matrix.platform
        uses: actions/upload-artifact@v6
        with:
          name: pack-${{ matrix.leg }}-run${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ matrix.artifact_glob }}

      # 失败时附诊断产物（与 ci.yml 同口径）
      - name: 失败时的诊断产物
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          # 名称以 diagnostics- 开头，避免与交付产物（pack-*）在发布汇总时混淆
          name: diagnostics-pack-${{ matrix.leg }}-run${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/desktop/**

  # 发布（T3）：仅在 tag 推送且四 leg 全绿时执行；手工触发不发 Release（裁决 4）
  release:
    name: 发布（GitHub Release）
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 最小权限：只有发布 job 具备写权限（裁决 5）
    permissions:
      contents: write
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Node（取自 .nvmrc）
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # 汇总四个 leg 的交付产物（诊断包以 diagnostics- 开头，不会被本模式选中）
      - name: 汇总四 leg 产物
        # v7 起才面向 Node 24（v6 仍面向 Node 20，会产生废弃告警）；与 DP-D 的「主版本 = 运行时」口径一致
        uses: actions/download-artifact@v8
        with:
          pattern: pack-*
          merge-multiple: true
          path: release

      # 版本守卫：tag / CHANGELOG 顶部版本段 / package.json 三方一致才继续；
      # 同时把该版本段写成 Release notes（设计 6.1、裁决 7）
      - name: 版本守卫与 Release notes
        run: |
          node scripts/release-guard.mjs \
            --tag "$GITHUB_REF_NAME" \
            --changelog CHANGELOG.md \
            --package package.json \
            --gui-package gui/package.json \
            --write-notes release/RELEASE_NOTES.md

      # 归位检查（恰好 5 个交付物）→ 生成 SHA256SUMS.txt → 创建或覆盖 Release（幂等）
      - name: 校验清单与发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-publish.mjs \
            --dir release \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --notes release/RELEASE_NOTES.md

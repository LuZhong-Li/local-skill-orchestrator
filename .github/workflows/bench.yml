# 性能压测烟测（三平台 N=100，双线）
#
# 定位（设计 §5 执行策略）：**只记录数据，不做性能门禁**——CI 是共享 runner，实测波动 17%~30%，
# 拿它当阈值判定没有意义。但「测量链路本身是否健康」必须有信号：采样失败或退出码超出预期码表
# 都会让本工作流变红（那是测量器坏了，不是性能波动）。
#
# 触发沿用推送验证路径（与 ci.yml 一致）+ 手工触发；`workflow_dispatch` 的首跑仍留 BX-02
# （当前会话无已登录浏览器，无法点 Run workflow）。

name: Bench

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: 烟测（${{ matrix.platform }}）
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-15
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建内核（SEA：两条线里的交付形态）
        run: npm run build:kernel

      - name: 赋可执行位（SEA 产物在 POSIX 上必须可直接执行）
        if: runner.os != 'Windows'
        run: chmod +x build/kernel/skill-manager.exe

      - name: macOS SEA 取证（EX-13：内核被信号终止；不改测量结论）
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          sea_try() {
            ./build/kernel/skill-manager.exe --version > /tmp/sea-out.txt 2>&1
            echo $?
          }
          sea_code=$(sea_try)
          cp "$(command -v node)" /tmp/node-copy
          chmod +x /tmp/node-copy
          /tmp/node-copy --version > /dev/null 2>&1
          node_copy_code=$?
          signature=$(codesign -dv build/kernel/skill-manager.exe 2>&1 | head -3 | tr '\n' ' ' | tr -s ' ')
          bytes=$(stat -f %z build/kernel/skill-manager.exe)
          mode=$(stat -f %Sp build/kernel/skill-manager.exe)
          echo "::warning title=EX-13 取证::SEA 内核退出码=$sea_code（137/负数多为信号终止）；对照 node 副本退出码=$node_copy_code；mode=$mode；bytes=$bytes；codesign=$signature"

      - name: 双线 N=100 烟测（场景全量、runs=1；macOS 暂只跑源码线，SEA 见 EX-13）
        run: node scripts/bench/runner.mjs --n 100 --form ${{ runner.os == 'macOS' && 'source' || 'both' }} --runs 1 --load "CI 共享 runner（波动 17%~30%，仅记录不作门禁）"

      - name: 记录数据并检查测量链路（运行页注解；采样失败即红，性能数值不作门禁）
        if: always()
        run: node scripts/bench/annotate.mjs build/bench

      - name: 上传测量数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.platform }}-run${{ github.run_id }}
          path: |
            build/bench/report-*.json
            build/bench/logs/
            build/bench/failure-*.txt
          if-no-files-found: ignore
          retention-days: 14

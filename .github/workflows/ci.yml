name: CI

# 触发策略（需求 9.3.1 M1-R1、设计 3 章）：
#   - 推送到主干与长期维护分支；
#   - 针对主干的合并请求在打开、提交同步与重新打开时；
#   - 手工触发入口，用于复现与排查；
#   - 同一分支的连续提交取消旧运行，结论只以最新提交为准。
# 夜间完整流水线按设计 11 章 DP-A 的处置**默认不启用**（CI-Q-01）：需要长耗时检查时再单独加入。
#
# 校验步骤集合定义在 .github/workflows/verify.yml（M2-R5：唯一实现）：
# 本工作流只保留触发与并发口径，步骤序列与抽取前逐条一致（同一份 verify.yml 也被 pack.yml 消费）。
on:
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # 可复用工作流承载 prepare + verify 两个 job（步骤与矩阵见 verify.yml）
    name: 校验
    uses: ./.github/workflows/verify.yml
